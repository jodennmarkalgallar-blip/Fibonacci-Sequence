# Tiny Tapeout project information
project:
  title:        "Fibonacci Counter (0-987)"      # Project title
  author:       "JODENN MARK ALGALLAR"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "BCD Fibonacci counter 0..987 (largest value <= 1000) on a 3-digit multiplexed 7-segment display"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_fibonacci_counter"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "*.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "STEP (rising edge = one Fibonacci step)"
  ui[1]: "RUN (1 = auto-step)"
  ui[2]: "SPEED[0]"
  ui[3]: "SPEED[1]"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "seg a"
  uo[1]: "seg b"
  uo[2]: "seg c"
  uo[3]: "seg d"
  uo[4]: "seg e"
  uo[5]: "seg f"
  uo[6]: "seg g"
  uo[7]: "dp (always 0)"

  # Bidirectional pins
  uio[0]: "digit select: ones (active low)"
  uio[1]: "digit select: tens (active low)"
  uio[2]: "digit select: hundreds (active low)"
  uio[3]: "MAX flag (display = 987)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
